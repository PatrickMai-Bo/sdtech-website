# =====================================================================
# 静态托管 + /api 反代 + /uploads 直出
# 前后端同源（同一 nginx），前端 API 基址恒为相对路径 /api，零跨域配置
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 上传体积上限（后端限制 5MB，此处略放宽）
    client_max_body_size 6m;

    # ---------------- gzip ----------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # ---------------- HTML 文档：不缓存 ----------------
    # 后台改完文案/图片，刷新前台立即生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # ---------------- 静态资源：长缓存 ----------------
    location ~* ^/assets/.*\.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
        access_log off;
    }

    # ---------------- 上传文件：与 app 共享命名卷 ----------------
    location /uploads/ {
        alias /var/www/uploads/;
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
        access_log off;
    }

    # ---------------- API 反代 ----------------
    # 注意：proxy_pass 末尾不带 /，保留原始 /api/** 路径
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # 后台保存后前台刷新即生效，禁止中间层缓存接口响应
        add_header Cache-Control "no-store";
    }

    # ---------------- 静态页面 ----------------
    location / {
        try_files $uri $uri/ =404;
    }
}
