# =====================================================================
# 顺德分布式科技艺术有限公司官网 — nginx 配置
#   80   : 默认入口（http://IP/ 直访 + http://patrickmai.cn 301 跳 HTTPS）
#   443  : https://patrickmai.cn / https://www.patrickmai.cn
# 前后端同源（同一 nginx），前端 API 基址恒为相对路径 /api，零跨域配置
# =====================================================================

# ---------------- 域名 HTTP -> HTTPS ----------------
server {
    listen 80;
    server_name patrickmai.cn www.patrickmai.cn;
    return 301 https://$host$request_uri;
}

# ---------------- 默认入口（IP 直接访问） ----------------
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 上传体积上限（后端限制 5MB，此处略放宽）
    client_max_body_size 6m;

    # ---------------- gzip ----------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # ---------------- HTML 文档：不缓存 ----------------
    # 后台改完文案/图片，刷新前台立即生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # ---------------- 静态资源：长缓存 ----------------
    location ~* ^/assets/.*\.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
        access_log off;
    }

    # ---------------- 上传文件：与 app 共享命名卷 ----------------
    location /uploads/ {
        alias /var/www/uploads/;
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
        access_log off;
    }

    # ---------------- API 反代 ----------------
    # 注意：proxy_pass 末尾不带 /，保留原始 /api/** 路径
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # 后台保存后前台刷新即生效，禁止中间层缓存接口响应
        add_header Cache-Control "no-store";
    }

    # ---------------- 静态页面 ----------------
    location / {
        try_files $uri $uri/ =404;
    }
}

# =====================================================================
# https://patrickmai.cn / https://www.patrickmai.cn
# 证书：TrustAsia DV（CN=patrickmai.cn，SAN 含 www），2026-11-12 到期，注意续期
# =====================================================================
server {
    listen 443 ssl;
    server_name patrickmai.cn www.patrickmai.cn;

    ssl_certificate     /etc/nginx/ssl/patrickmai.crt;
    ssl_certificate_key /etc/nginx/ssl/patrickmai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # HTML 不缓存
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # 静态资源长缓存
    location ~* ^/assets/.*\.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
        access_log off;
    }

    # 上传文件
    location /uploads/ {
        alias /var/www/uploads/;
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
        access_log off;
    }

    # API 反代（同源，前端仍用相对路径 /api）
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
