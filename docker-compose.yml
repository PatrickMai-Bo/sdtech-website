# =====================================================================
# 顺德分布式科技艺术有限公司官网 — 编排文件
#   nginx : 对外 80（唯一暴露端口）
#   app   : 内网 8080，调试用可映射 8080（主机 8080 冲突时可注释 ports）
#   mysql : 仅内网 3306（主机 3306 已被 finance-mysql 占用，禁止映射）
# 启动：cp .env.example .env 后修改密码，再 docker compose up -d --build
# =====================================================================
services:

  mysql:
    image: mysql:8.0
    container_name: sdtech-mysql
    restart: unless-stopped
    # 关键：官方镜像的 mysql 客户端默认 latin1，会导致 /docker-entrypoint-initdb.d 里的
    # UTF-8 中文被按 latin1 写入（双编码乱码）。强制服务端 utf8mb4 并忽略客户端握手。
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - sdtech-mysql-data:/var/lib/mysql
      # 仅首次启动（数据卷为空时）执行，脚本全部幂等
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 注意：不映射主机 3306，避免与主机已有 MySQL 冲突

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sdtech-app
    restart: unless-stopped
    env_file: .env
    environment:
      # 注意：characterEncoding 必须用 Java 字符集名 UTF-8，写 utf8mb4 会导致驱动报
      # "Unsupported character encoding 'utf8mb4'"，utf8mb4 由 MySQL 服务端字符集决定
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JAVA_OPTS: -Xmx512m -Xms256m
      TZ: Asia/Shanghai
    ports:
      # 调试用；上线后如与主机端口冲突可整段注释，对外只经 nginx /api 反代
      - "8080:8080"
    volumes:
      - sdtech-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: sdtech-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - sdtech-uploads:/var/www/uploads
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - app

volumes:
  sdtech-mysql-data:
  sdtech-uploads:
